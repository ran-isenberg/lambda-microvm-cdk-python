# Two-stage CI/CD pipeline:
#   1. quality_standards — lint, type-check, complexity, unit tests, cdk synth (cdk-nag). No AWS creds.
#   2. deploy_e2e        — gated real-AWS stage: deploy the sample stack, launch a MicroVM via boto3,
#                          assert the deterministic /echo tier, then ALWAYS terminate the VM and
#                          destroy the stack.
# Stage 2 runs only after stage 1 passes (needs:) AND only once approved through the `dev`
# environment's required-reviewer gate (repo Settings -> Environments -> dev). Until approved it
# pauses; the AWS_ROLE_ARN (a `dev` environment secret) is not exposed until you approve. Approve
# only after reviewing the PR diff — the approved run executes the PR's code against your AWS account.
name: CI/CD

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"
  AWS_REGION: "us-east-1"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # No push:[main] trigger — every change reaches main through a PR that already ran this full
  # pipeline, so re-running it (incl. the gated deploy_e2e) on the merge commit is redundant.
  # Periodic real-AWS coverage of main comes from the weekly schedule below.
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC — scheduled real-AWS E2E

jobs:
  quality_standards:
    runs-on: ubuntu-24.04-arm # native arm64 — matches the MicroVM ARM_64 target
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Set up Node # provides npx for the aws-cdk CLI used by `make synth`
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: make dev
      - name: Formatting, linting and types
        run: make lint
      - name: Complexity scan
        run: make complex
      - name: Unit tests (boto3 mocked, no AWS)
        run: make unit
      - name: cdk synth (runs cdk-nag AwsSolutionsChecks)
        run: make synth

  deploy_e2e:
    # Gated real-AWS stage — runs only after quality_standards passes, and only once approved via
    # the `dev` environment's required reviewers. Deploys, runs E2E, and ALWAYS tears down.
    needs: quality_standards
    runs-on: ubuntu-24.04-arm
    environment: dev
    permissions:
      id-token: write # request the OIDC JWT to assume the AWS role
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Set up Node # npx aws-cdk for deploy/destroy
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: make dev
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.sha }}-e2e
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy sample stack
        run: make deploy
      - name: E2E — launch VM, prompt, assert, terminate in teardown
        run: make e2e
      - name: Destroy sample stack
        if: always() # tear down even if the E2E step failed
        run: make destroy

# Lint, type-check, complexity, unit tests and cdk synth (incl. cdk-nag).
# No AWS credentials required — the base-image lookup falls back to "0" and boto3 is mocked in unit tests.
name: CI

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"
  AWS_REGION: "us-east-1"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality_standards:
    runs-on: ubuntu-24.04-arm # native arm64 — matches the MicroVM ARM_64 target
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Set up Node # provides npx for the aws-cdk CLI used by `make synth`
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: make dev
      - name: Formatting, linting and types
        run: make lint
      - name: Complexity scan
        run: make complex
      - name: Unit tests (boto3 mocked, no AWS)
        run: make unit
      - name: cdk synth (runs cdk-nag AwsSolutionsChecks)
        run: make synth

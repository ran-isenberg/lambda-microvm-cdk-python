[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lambda-microvm-cdk"
version = "0.1.0"
description = "Reusable AWS CDK (Python) construct for provisioning AWS Lambda MicroVM images and launchers."
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.11"
authors = [{ name = "Ran Isenberg", email = "isenberg.ran@gmail.com" }]
keywords = ["aws", "cdk", "lambda", "microvm", "firecracker", "construct"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aws-cdk-lib>=2.150.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
    "boto3>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "radon>=6",  # cyclomatic-complexity report (make complex / CI complexity scan)
    "xenon>=0.9",  # fails the build when complexity exceeds the configured thresholds
    "cdk-nag>=2.35,<3",  # v3 is an experimental rework (no NagSuppressions/Aspects API yet); the stable v2 API is what we target
    "anthropic[bedrock]",  # sample worker tier 2 (Claude-on-Bedrock via AnthropicBedrockMantle); enables mypy to typecheck sample/microvm_app
    "zensical>=0.0.50",
    # VpcV2 / SubnetV2 for the SAMPLE's egress VPC only — the library construct is BYO-VPC and uses just
    # stable aws_cdk.aws_ec2 types, so consumers never need this alpha module. Version-locked to aws-cdk-lib.
    "aws-cdk-aws-ec2-alpha>=2.261.0a0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/ran-isenberg/lambda-microvm-cdk-python"
Repository = "https://github.com/ran-isenberg/lambda-microvm-cdk-python"
Documentation = "https://ran-isenberg.github.io/lambda-microvm-cdk-python/"
Issues = "https://github.com/ran-isenberg/lambda-microvm-cdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lambda_microvm_cdk"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E203", "E266", "E501", "W191"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "sample"
exclude = ['cdk\.out', 'dist']

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
